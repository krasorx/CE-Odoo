services:
  odoo:
    container_name: odoo_ce
    build: .
    #image: odoo:18
    restart: always
    depends_on:
      - postgres
    volumes:
      - odoo_ce_data:/var/lib/odoo
      - ./odoo.conf:/etc/odoo/odoo.conf.template
      - ./addons/:/mnt/extra-addons
      - ./entrypoint.sh:/entrypoint.sh
      - ./requirements.txt:/requirements.txt
      - ./backup/panama:/backup:ro
    environment:
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - ODOO_ADMIN_PASSWORD=${ODOO_ADMIN_PASSWORD}
      - BACKUP_NAME=${BACKUP_NAME}
      - DEMO=${DEMO}
    env_file:
      - .env
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    networks:
      - odooce18_net
      - traefik_net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.odooce.rule=Host(`${ODOO_HOST}`)"
      - "traefik.http.routers.odooce.entrypoints=websecure"
      - "traefik.http.routers.odooce.tls=true"
      - "traefik.http.routers.odooce.tls.certresolver=letsencrypt"
      - "traefik.http.routers.odooce.service=odooce"
      - "traefik.http.services.odooce.loadbalancer.server.port=8069"

  postgres:
    command: postgres -c log_connections=on -c log_min_messages=DEBUG1
    container_name: postgres_ce
    image: postgres:17.0-bullseye
    restart: always
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - PGDATA=/var/lib/postgresql/data
    networks:
      - odooce18_net
    volumes:
      - db_data_filestore:/var/lib/postgresql/data

networks:
  odooce18_net:
  traefik_net:
    external: true

volumes:
  db_data_filestore:
  odoo_ce_data:
